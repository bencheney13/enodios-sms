<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>QuickBooks connection - MF-CFO</title>
<style>
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #222; }
textarea { width: 100%; height: 7em; font-family: ui-monospace, Consolas, monospace; font-size: 0.85em; }
button { font-size: 1em; padding: 8px 16px; }
</style>
</head>
<body>
<h1>QuickBooks connection</h1>
<p id="msg">This page finishes a QuickBooks sign-in started from MF-CFO's own connector. Nothing on it is stored or sent anywhere.</p>
<div id="box" hidden>
<p><strong>Copy this address and paste it into the terminal that is waiting for it.</strong> It works once and expires in a few minutes.</p>
<textarea id="addr" readonly></textarea>
<p><button id="copy" type="button">Copy</button> <span id="done"></span></p>
</div>
<script>
var q = new URLSearchParams(location.search);
if (q.get("code") || q.get("error")) {
  document.getElementById("box").hidden = false;
  document.getElementById("addr").value = location.href;
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(location.href).then(function () {
      document.getElementById("done").textContent = "Copied.";
    });
  };
}
</script>
</body>
</html>
